[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "clawcommit-lucid"
version = "0.1.0"
description = "Lucid commit messages — analyze code changes and generate clear, conventional commit messages."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "SuperInstance" }]
keywords = ["git", "commit", "conventional-commits", "diff", "code-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
